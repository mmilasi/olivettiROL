<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS Dashboard - ROL - Registro OffLine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center border border-slate-100">
            <h1 class="text-4xl font-black text-indigo-600 mb-2 italic tracking-tighter">Registro OffLine</h1>
            <h2 class="text-xl font-bold mb-8 text-slate-400 uppercase tracking-widest text-sm">Login Docente</h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Username" class="w-full p-4 bg-slate-100 rounded-2xl outline-none border border-transparent focus:border-indigo-500 transition-all">
                <input type="password" id="pass" placeholder="Password" class="w-full p-4 bg-slate-100 rounded-2xl outline-none border border-transparent focus:border-indigo-500 transition-all">
                <button onclick="login()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 hover:-translate-y-1 transition-all">ACCEDI</button>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden">
        <nav class="bg-white border-b p-6 flex justify-between items-center px-12 sticky top-0 z-50 shadow-sm">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter italic">Registro <span class="text-indigo-600">OffLine</span></h1>
                <p id="nav-date" class="text-[10px] text-slate-400 font-black uppercase tracking-widest"></p>
            </div>
            <div class="flex items-center gap-6">
                <div id="user-display" class="font-bold text-slate-700 text-sm bg-slate-100 px-4 py-2 rounded-full"></div>
                <button onclick="logout()" class="text-rose-500 font-black text-xs uppercase hover:underline tracking-widest">Logout 🚪</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-8">
                
                <div id="active-session-card" class="hidden bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <svg width="100" height="100" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M13 7h-2v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    </div>
                    <span class="bg-indigo-400 text-[10px] font-black px-3 py-1 rounded-full uppercase">Lezione in Corso</span>
                    <h2 id="active-subject" class="text-3xl font-bold mt-4 leading-tight">---</h2>
                    <p id="active-materia-display" class="text-indigo-200 text-sm font-bold uppercase tracking-widest mt-1">---</p>
                    <p id="active-range" class="opacity-80 mb-8 font-mono mt-4 text-lg">--:-- - --:--</p>
                    <button onclick="terminateSession()" class="w-full bg-white text-indigo-600 py-4 rounded-2xl font-black hover:bg-rose-50 hover:text-rose-600 transition-all shadow-lg">CHIUDI REGISTRO</button>
                </div>

                <div id="new-session-form" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <h3 class="text-xl font-bold mb-6 text-slate-800 tracking-tight">Avvia Registro</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block ml-1">Argomento</label>
                            <input type="text" id="lesson_desc" placeholder="Es. Introduzione a Docker" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all border border-slate-100">
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block ml-1">Corso di Riferimento</label>
                            <select id="lesson_corso" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all border border-slate-100 font-bold text-slate-600">
                                <option value="Cloud DevOps 24/26">Cloud DevOps 24/26</option>
                                <option value="Cybersecurity 24/26">Cybersecurity 24/26</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block ml-1">Inizio</label>
                                <input type="time" id="start_time" class="w-full p-4 bg-slate-50 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none border border-slate-100">
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block ml-1">Fine</label>
                                <input type="time" id="end_time" class="w-full p-4 bg-slate-50 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none border border-slate-100">
                            </div>
                        </div>
                        <button onclick="activateTotem()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 hover:scale-[1.02] transition-all mt-2">ATTIVA TOTEM</button>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                    <h3 class="text-lg font-bold mb-6 text-slate-800">Storico Lezioni</h3>
                    <div id="history-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-white p-10 rounded-[3rem] border border-slate-200 shadow-sm min-h-[600px]">
                
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h3 id="table-title" class="text-2xl font-black text-slate-800 tracking-tight">Registro Live</h3>
                        <p id="table-subtitle" class="text-sm text-slate-400">Dati in tempo reale dal Totem</p>
                    </div>
                </div>

                <div id="filter-bar" class="hidden bg-slate-50 p-6 rounded-3xl mb-10 border border-slate-100 grid grid-cols-1 md:grid-cols-4 gap-4 items-end shadow-inner">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Stato Presenza</label>
                        <select id="filter-stato" class="w-full p-3 bg-white rounded-xl border-none shadow-sm text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Tutti</option>
                            <option value="presenti">Solo Presenti</option>
                            <option value="assenti">Solo Assenti</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Residenza</label>
                        <select id="filter-fuori" class="w-full p-3 bg-white rounded-xl border-none shadow-sm text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Tutti</option>
                            <option value="sì">Solo Fuorisede</option>
                            <option value="no">Solo Residenti</option>
                        </select>
                    </div>
                    <div class="flex items-center pb-3">
                        <input type="checkbox" id="filter-ritirati" class="w-5 h-5 text-indigo-600 rounded-lg accent-indigo-600">
                        <label for="filter-ritirati" class="ml-2 text-sm font-bold text-slate-600">Includi Ritirati</label>
                    </div>
                    <button onclick="generatePDF()" class="bg-slate-800 text-white py-3 rounded-xl font-bold text-[11px] uppercase tracking-widest hover:bg-black transition-all shadow-lg flex items-center justify-center gap-2">
                        <span>Report PDF</span> 📄
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest border-b border-slate-100">
                                <th class="pb-6 text-left">Studente</th>
                                <th class="pb-6 text-center">Entrata</th>
                                <th class="pb-6 text-center">Uscita</th>
                                <th class="pb-6 text-right">Presenza</th>
                            </tr>
                        </thead>
                        <tbody id="student-list" class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let jwtToken = localStorage.getItem('token') || "";
        let currentView = { teacher: "", lesson: "", isLive: true };
        let currentUser = {};

        if(jwtToken) showDashboard();

        function resetForm() {
            document.getElementById('lesson_desc').value = "";
            const now = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('start_time').value = now;
            document.getElementById('end_time').value = "";
        }

        async function login() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });

            if(res.ok) {
                const data = await res.json();
                jwtToken = data.token;
                localStorage.setItem('token', jwtToken);
                showDashboard();
            } else {
                alert("Credenziali errate!");
            }
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }

        async function showDashboard() {
            const res = await fetch('/api/me', { headers: {'x-access-token': jwtToken} });
            if(!res.ok) return logout();
            currentUser = await res.json();
            
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('user-display').innerText = `👨‍🏫 ${currentUser.full_name}`;
            document.getElementById('nav-date').innerText = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
            
            resetForm();
            updateLoop();
            setInterval(updateLoop, 3000);
        }

        function updateLoop() {
            checkActiveSession();
            fetchHistory();
            if(currentView.isLive) fetchAttendance();
        }

        async function checkActiveSession() {
            const res = await fetch('/api/active_session');
            const data = await res.json();
            const card = document.getElementById('active-session-card');
            const form = document.getElementById('new-session-form');

            if(data.active) {
                card.classList.remove('hidden');
                form.classList.add('hidden');
                document.getElementById('active-subject').innerText = data.description;
                document.getElementById('active-materia-display').innerText = data.subject;
                document.getElementById('active-range').innerText = data.range;
                
                if(currentView.isLive) {
                    currentView.teacher = currentUser.username;
                    currentView.lesson = data.description;
                }
            } else {
                card.classList.add('hidden');
                form.classList.remove('hidden');
            }
        }

        async function fetchAttendance() {
            if(!currentView.lesson) return;
            const res = await fetch(`/api/attendance/${currentView.teacher}/${encodeURIComponent(currentView.lesson)}`);
            const data = await res.json();
            renderTable(data);
        }

        function renderTable(data) {
            const list = document.getElementById('student-list');
            const filterBar = document.getElementById('filter-bar');

            if (data.length === 0 && currentView.isLive) {
                list.innerHTML = `<tr><td colspan="4" class="py-20 text-center text-slate-300 font-medium italic">In attesa della prima scansione dal Totem...</td></tr>`;
                filterBar.classList.add('hidden');
                return;
            }

            filterBar.classList.remove('hidden');

            list.innerHTML = data.map(p => `
                <tr class="text-sm group hover:bg-slate-50 transition-colors">
                    <td class="py-5 font-bold text-slate-700">${p.student_name}</td>
                    <td class="text-center font-mono text-slate-400 text-xs tracking-tighter">${p.entry_time}</td>
                    <td class="text-center font-mono text-slate-400 text-xs tracking-tighter">${p.exit_time || '--:--'}</td>
                    <td class="text-right">
                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest ${p.status.includes('Uscita') ? 'bg-slate-100 text-slate-400' : 'bg-green-100 text-green-700'}">
                            ${p.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        async function fetchHistory() {
            const res = await fetch('/api/sessions_history', { headers: {'x-access-token': jwtToken} });
            const data = await res.json();
            const list = document.getElementById('history-list');
            
            if(data.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">Nessuna sessione registrata oggi</p>`;
                return;
            }

            list.innerHTML = data.map(s => `
                <div onclick="viewPastSession('${s.teacher}', '${s.description}')" class="p-4 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:border-indigo-500 hover:shadow-md transition-all group">
                    <div class="flex justify-between items-start">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">${s.start_time} - ${s.end_time}</p>
                        ${s.is_active ? '<span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>' : ''}
                    </div>
                    <p class="font-bold text-slate-800 text-sm truncate mt-1 group-hover:text-indigo-600">${s.description}</p>
                    <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">${s.corso}</p>
                </div>
            `).join('');
        }

        function viewPastSession(teacher, lesson) {
            currentView = { teacher, lesson, isLive: false };
            document.getElementById('table-title').innerText = "Dettaglio Storico";
            document.getElementById('table-subtitle').innerText = `Lezione: ${lesson}`;
            fetchAttendance();
        }

        function generatePDF() {
            if(!currentView.lesson) return alert("Seleziona una lezione per generare il report!");

            const stato = document.getElementById('filter-stato').value;
            const fuori = document.getElementById('filter-fuori').value;
            const ritirati = document.getElementById('filter-ritirati').checked;

            let url = `/api/export_pdf?teacher=${currentView.teacher}&lesson=${encodeURIComponent(currentView.lesson)}`;
            
            if(stato) url += `&stato=${stato}`;
            if(fuori) url += `&fuorisede=${fuori}`;
            if(ritirati) url += `&ritirati=true`;

            window.open(url, '_blank');
        }

        async function activateTotem() {
            const payload = {
                description: document.getElementById('lesson_desc').value,
                corso: document.getElementById('lesson_corso').value,
                start_time: document.getElementById('start_time').value,
                end_time: document.getElementById('end_time').value
            };

            if(!payload.description || !payload.start_time || !payload.end_time) {
                return alert("Tutti i campi sono obbligatori!");
            }

            const res = await fetch('/api/activate_lesson', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'x-access-token': jwtToken},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                currentView.isLive = true;
                resetForm();
                updateLoop();
            } else {
                alert("Errore durante l'attivazione della sessione.");
            }
        }

        async function terminateSession() {
            if(!confirm("Sei sicuro di voler chiudere il registro? Gli studenti non potranno più loggare presenze.")) return;
            
            const res = await fetch('/api/deactivate_lesson', { 
                method: 'POST', 
                headers: {'x-access-token': jwtToken} 
            });

            if(res.ok) {
                currentView.lesson = "";
                resetForm();
                updateLoop();
            }
        }
    </script>
</body>
</html>
